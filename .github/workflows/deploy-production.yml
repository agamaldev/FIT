name: Deploy to production

# Builds, tests and deploys the FIT API - which also serves the MAKE ME FIT
# frontend - to mmfit.space.
#
# Two jobs, deliberately on different runners:
#
#   test    -> ubuntu-latest (GitHub-hosted)
#   deploy  -> self-hosted runner on the production VPS
#
# WHY THE TESTS DO NOT RUN ON THE VPS
# 13 of the 14 test classes use Testcontainers, which starts a real postgres:16
# container per fixture. Docker is not installed on the production server and
# installing it there just to run tests would add a large attack surface to a box
# that serves the live site. GitHub's Ubuntu runners ship with Docker already, and
# this repository is public so those minutes are free. The hosted runner only ever
# runs tests - it never touches the server, holds no credential and opens no port.
#
# WHY THE DEPLOY RUNS ON THE VPS
# No inbound port is opened, no server credential is stored in GitHub, and the
# published output never crosses the internet - it is copied from the runner's
# workspace into the IIS folder on the same disk.
#
# A test failure blocks the deploy: `needs: test` means the deploy job never
# starts unless the whole suite passed.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a run mid-swap: cancelling between "stop App Pool" and "start App
# Pool" would leave the site down with app_offline.htm in place.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  # ------------------------------------------------------------------ test
  test:
    name: Test (Testcontainers + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore server/FitApi.sln

      - name: Build
        run: dotnet build server/FitApi.sln -c Release --no-restore

      # CustomWebApplicationFactory points Frontend:WebRoot at the repo root, so
      # the tests serve the real index.html straight out of the checkout.
      - name: Test
        run: dotnet test server/FitApi.sln -c Release --no-build --logger "trx;LogFileName=fitapi.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------------ deploy
  deploy:
    name: Deploy to IIS
    needs: test
    runs-on: [self-hosted, windows, mmfit-prod]
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Record what is being deployed
        shell: pwsh
        run: |
          Write-Host "Commit : $env:GITHUB_SHA"
          Write-Host "Ref    : $env:GITHUB_REF"
          Write-Host "Actor  : $env:GITHUB_ACTOR"
          Write-Host "Runner : $env:RUNNER_NAME as $env:USERDOMAIN\$env:USERNAME"

      # Publish into a CLEAN staging folder. Stale files from a previous run would
      # otherwise be mirrored into production by robocopy /MIR.
      - name: Publish API to staging
        shell: pwsh
        run: |
          $staging = 'C:\MMFit\staging\Web'
          if (Test-Path $staging) { Remove-Item "$staging\*" -Recurse -Force }
          else { New-Item -ItemType Directory -Path $staging -Force | Out-Null }
          dotnet publish server\FitApi\FitApi.csproj -c Release -o $staging --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with $LASTEXITCODE" }

      # The API serves the frontend from <ContentRoot>\wwwroot. This mirrors the
      # Dockerfile, EXCEPT the Dockerfile also copies html\ - the 160 MB purchased
      # Gymort template - which no page references. Source\ (53 MB of PDFs) is
      # likewise unreferenced. Neither is shipped.
      - name: Stage frontend into wwwroot
        shell: pwsh
        run: |
          $wwwroot = 'C:\MMFit\staging\Web\wwwroot'
          New-Item -ItemType Directory -Path $wwwroot -Force | Out-Null
          $pages = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter *.html -File
          if (-not $pages) { throw "No .html pages found in the checkout" }
          $pages | Copy-Item -Destination $wwwroot -Force
          Write-Host "staged $($pages.Count) pages"
          robocopy "$env:GITHUB_WORKSPACE\assets" "$wwwroot\assets" /MIR /NFL /NDL /NJH /NP /R:2 /W:2
          if ($LASTEXITCODE -ge 8) { throw "staging assets failed with robocopy exit $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      # From here the deploy script owns everything: pre-flight, backup,
      # app_offline + App Pool stop, mirrored copy with exclusions, restart,
      # health check and automatic rollback.
      - name: Deploy
        shell: pwsh
        run: |
          & .\deploy\Deploy-Site.ps1
          if ($LASTEXITCODE -ne 0) { throw "Deployment failed with exit code $LASTEXITCODE" }

      # A wrong /MIR would delete user-uploaded avatars, the live stdout logs, or
      # the ACME challenge directory. Assert after every single deploy.
      - name: Verify protected paths survived the deploy
        if: always()
        shell: pwsh
        run: |
          $checks = @(
            'C:\MMFit\sites\Web\uploads',
            'C:\MMFit\sites\Web\.well-known\acme-challenge\web.config',
            'C:\MMFit\sites\Web\appsettings.Production.json',
            'C:\MMFit\sites\Web\FitApi.dll',
            'C:\MMFit\sites\Web\wwwroot\index.html'
          )
          $bad = @()
          foreach ($p in $checks) {
            if (Test-Path $p) { Write-Host "OK      $p" } else { Write-Host "MISSING $p"; $bad += $p }
          }
          if ($bad.Count -gt 0) { throw "PROTECTED PATHS MISSING AFTER DEPLOY: $($bad -join ', ')" }

      - name: Public smoke test
        shell: pwsh
        run: |
          # Hits the real public hostnames over TLS, so this also catches an
          # expired or mis-bound certificate - something the script's localhost
          # health check cannot see.
          $failed = @()
          foreach ($u in @('https://mmfit.space/api/health', 'https://www.mmfit.space/api/health')) {
            try {
              $r = Invoke-WebRequest -Uri $u -UseBasicParsing -TimeoutSec 30
              if ($r.StatusCode -eq 200 -and $r.Content -match '"status"\s*:\s*"ok"') { Write-Host "OK   $u" }
              else { Write-Host "BAD  $u  HTTP $($r.StatusCode)  $($r.Content)"; $failed += $u }
            } catch { Write-Host "FAIL $u  $($_.Exception.Message)"; $failed += $u }
          }
          foreach ($u in @('https://mmfit.space/', 'https://mmfit.space/auth.html')) {
            try {
              $r = Invoke-WebRequest -Uri $u -UseBasicParsing -TimeoutSec 30
              if ($r.StatusCode -eq 200) { Write-Host "OK   $u  ($($r.RawContentLength) bytes)" }
              else { Write-Host "BAD  $u  HTTP $($r.StatusCode)"; $failed += $u }
            } catch { Write-Host "FAIL $u  $($_.Exception.Message)"; $failed += $u }
          }
          if ($failed.Count -gt 0) { throw "Public smoke test failed for: $($failed -join ', ')" }

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $status = if ('${{ job.status }}' -eq 'success') { 'succeeded' } else { '${{ job.status }}' }
          @(
            "## mmfit.space deploy $status",
            "",
            "| | |",
            "|---|---|",
            "| Commit | ``$env:GITHUB_SHA`` |",
            "| Actor | $env:GITHUB_ACTOR |",
            "| Runner | $env:RUNNER_NAME |",
            "| Site | https://mmfit.space |",
            "",
            "Rollback on the server if needed:",
            '```powershell',
            'C:\MMFit\src\deploy\Deploy-Site.ps1 -Rollback',
            '```'
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
